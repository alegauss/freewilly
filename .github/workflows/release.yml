# DD15 — a release with checksums, held still before it is public.
#
# What it produces is a **draft** release, and that is the point — site.yml states this
# repository's rule for publishing ("a deploy on every push is one nobody can hold still while
# reviewing it"), and a release is the one artefact where a defect reaches people who cannot undo
# it. So this builds and attaches everything, and a person presses Publish after looking.
#
# That gap is doing real work rather than being ceremony: CI cannot verify the engine install at
# all. A hosted runner has no nested virtualization, so `--provision` has nowhere to import a WSL2
# distribution. The draft is where the installer gets run on a machine that does — by hand, or
# through scripts/vm.ps1 against the test guest — before anybody can download it.
#
# **DD161 took the tag trigger off.** `build\update-release.cmd <version> upload` now creates the
# release itself, from the installer it just built on a machine that can run it — so this firing on
# the same tag would race that `gh release create` and fail whichever ran second. The argument above
# is not withdrawn; the answer to it moved to the maintainer, who has the installer in front of them
# and can pass -Draft to publish-release.ps1 to get exactly this behaviour back.
#
# It stays because it is the clean-room build: one checkout, one toolchain, nothing of the
# maintainer's machine in it, and the tag checked against what the build produced. Run it by hand
# against a tag when that is what is wanted — a release the local path could not make, or a second
# opinion about one it did:
#
#   gh workflow run release.yml --ref v0.1.0
#
# The tag must match <Version> in Directory.Build.props; the job refuses otherwise rather than
# publishing an installer whose Add/Remove Programs entry disagrees with its own file name. Note
# that `gh release create` below refuses a tag that already has a release, which is the ordinary
# state after the local path has run: delete that release first, or take the artefacts from the
# run's logs.

name: release

on:
  # Dispatch only, since DD161. Choose a tag as the ref — GITHUB_REF_NAME is what the version
  # check and `gh release create` both read, and on a tag ref that is the tag name.
  workflow_dispatch:

# gh release create writes to this repository, and nothing here needs anything else.
permissions:
  contents: write

jobs:
  release:
    name: build, sign nothing, attach the installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # --generate-notes reads the commits since the previous tag, and a shallow clone has none
          # of them: the notes come out empty on a repository that has plenty to say.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # The gate, before anything is packaged. A release built from a red tree is the one thing
      # worse than no release.
      - name: Build
        run: dotnet build --nologo

      - name: Test
        run: dotnet test --nologo

      # The probe moved into a composite action when check.yml needed the same one (DD102). The
      # path it reports is unused here — build-installer.cmd runs its own three-path probe, because
      # it is also what a maintainer runs by hand — so what this step buys is only the install.
      - name: Inno Setup
        uses: ./.github/actions/inno-setup

      # Publishes the single .exe and wraps it, exactly as a maintainer would locally. The same
      # script, so a release cannot be built by a path nobody uses by hand.
      - name: Publish and build the installer
        run: .\build\build-installer.cmd

      - name: The tag is the version the .exe carries
        run: |
          # DD14 put the version in one place and had the installer read it back off the built .exe.
          # This is the other end of that chain: a tag naming a version the build did not produce
          # would ship an installer whose file name and whose Add/Remove Programs entry disagree,
          # and the only place that is cheap to catch is here.
          $exe = "src\FreeWilly.Tray\bin\Release\net10.0-windows\win-x64\publish\FreeWilly.exe"
          $built = (Get-Item $exe).VersionInfo.ProductVersion.Trim()
          $tagged = "$env:GITHUB_REF_NAME" -replace '^v', ''
          Write-Output "tag $env:GITHUB_REF_NAME, built $built"
          if ($built -ne $tagged) {
            throw "the tag says $tagged and the build says $built - change <Version> in Directory.Build.props, or move the tag"
          }
          "VERSION=$built" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Name it, sum it, release it — the same script the local path runs (DD161), with -Draft,
      # which is the one thing this job wants that the local path does not default to.
      #
      # One implementation rather than two, and the reason is the class of defect DD157 and DD159
      # spent two tasks on: these steps and build\publish-release.ps1 would be the same three
      # decisions written twice, and the copy nobody ran would be the one that drifted. The asset
      # name is what DD154's release check matches on and the sums file is what it verifies
      # against, so a drift here is a self-update that silently stops working.
      #
      # The installer, and nothing beside it (DD152). The bare published .exe used to be attached
      # as well, and a release page offering two files makes the reader choose between them — a
      # choice this project has no reason to hand out. The single-file .exe is not a second,
      # lighter product: it provisions the engine on first run exactly as the installed copy does,
      # and it arrives without the uninstall entry, the Run value and the shim on PATH that the
      # rest of the product assumes. Whoever wants it can still build it, and build.cmd is the one
      # line that does.
      - name: Name the installer after the version, sum it, and draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .\build\publish-release.ps1 -Version $env:VERSION -Draft
          Write-Output "drafted. Nothing is public until it is published by hand."
