# DD15 — the second machine.
#
# A Windows desktop application built on one developer's machine has one build environment, and
# every bug that environment hides is found by the first person who downloads a release. This is
# the other machine.
#
# windows-latest is not a preference. Cross-compiling a WPF application is not the thing under
# test; what is under test is that the produced .exe *starts* on a Windows image nobody developed
# on, which is exactly the failure a local build cannot see. So the last three steps run the
# published single-file executable rather than only building it.
#
# roadkeep lint is not here either, and this time it is somewhere: `roadkeep install` writes
# .github/workflows/roadkeep.yml, which calls the action roadkeep publishes. The write-time hooks
# refuse a hand edit on the machine doing the writing; that workflow is the half that catches
# drift arriving by any other route, which for a while reached `main` unremarked.
#
# What this cannot check is the engine install. A hosted runner has no nested virtualization, so
# `--provision` has nowhere to import a WSL2 distribution; that path stays a manual check against
# the release candidate (scripts/vm.ps1 drives it), and saying so is better than a green tick that
# means less than it appears to.

name: check

on: [push, pull_request]

jobs:
  build:
    name: build, test, and start the .exe
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          # The band, not a patch. The runner image ships whatever .NET it ships, and pinning a
          # patch here is a build that breaks on a day nobody changed anything.
          dotnet-version: "10.0.x"

      # TreatWarningsAsErrors and EnforceCodeStyleInBuild are already on in
      # Directory.Build.props, so there is nothing to add on the command line: a warning is
      # already what stops this.
      - name: Build
        run: dotnet build --nologo

      - name: Test
        run: dotnet test --nologo

      # Release, because that is the configuration the single-file self-contained properties are
      # conditioned on — a Debug build proves nothing about the thing that gets shipped.
      # The project file and not the folder (DD109): an interrupted WPF build leaves a
      # <name>_<random>_wpftmp.csproj beside it, and MSBuild answers a folder holding two projects
      # with MSB1050 before it evaluates anything. A runner is clean, so this is not for CI's sake —
      # it is so the line a developer copies out of here is the one that cannot fail that way.
      - name: Publish the one .exe
        run: dotnet publish src\FreeWilly.Tray\FreeWilly.Tray.csproj -c Release --nologo

      # DD150. The other binary the installer packages, and it has to exist before the compile step
      # below reads [Files]. build\build-installer.cmd produces both, which is why release.yml never
      # saw this — that workflow runs the script, and this one spells the publishes itself.
      #
      # DD141 is why there are two at all: a command a shell waits for must be console-subsystem,
      # and the tray's .exe is a windowed application.
      - name: Publish the docker forwarder
        run: dotnet publish src\FreeWilly.Shim\FreeWilly.Shim.csproj -c Release --nologo

      - name: It is one file, and only one
        run: |
          $dir = "src\FreeWilly.Tray\bin\Release\net10.0-windows\win-x64\publish"
          $exe = Join-Path $dir "FreeWilly.exe"
          if (-not (Test-Path $exe)) { throw "publish produced no $exe" }
          # The claim DD14 rests on. A stray .dll here means the bundle stopped being
          # self-contained and the installer would ship an .exe that cannot start on a clean
          # machine — which is the one failure this whole workflow exists to catch.
          $dlls = @(Get-ChildItem $dir -Filter *.dll)
          if ($dlls.Count -gt 0) {
            throw "$($dlls.Count) loose .dll(s) beside the .exe: $($dlls.Name -join ', ')"
          }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Output "one file, $mb MB"

      # DD102. Before this, the first thing that read build\installer.iss was the release — so a
      # syntax error in it stopped the release rather than the commit that caused it, with the tag
      # already pushed. That is DD88's defect in a second file: nothing on the ordinary path read it.
      #
      # PackagingTests is not this and must not be mistaken for it. It asserts over the script as
      # *text* — that a line says `ValueType: none`, that an AppId is spelled a certain way — which
      # proves the file says what the author meant and cannot say whether Inno accepts it. DD97
      # shipped an Inno construct on exactly that evidence.
      #
      # Unconditional, and that is the decision the task left open. Gating it on `build/` having
      # changed would put the one reader of this file back on a conditional path, which is the
      # failure being repaired; and the cost the gate would save is not there — the runner image
      # ships ISCC, and the compile needs a published .exe that the step above has already paid for.
      - name: Inno Setup
        id: inno
        uses: ./.github/actions/inno-setup

      - name: The installer script compiles
        run: |
          & "${{ steps.inno.outputs.iscc }}" build\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC refused build\installer.iss (exit $LASTEXITCODE)" }

          # Asserted on the artefact and not only on the exit code: [Files] names the published
          # .exe, and a script that compiled while packaging nothing is the failure a syntax check
          # alone would wave through.
          $setup = "dist\FreeWilly-Setup.exe"
          if (-not (Test-Path $setup)) { throw "ISCC exited 0 and produced no $setup" }
          $mb = [math]::Round((Get-Item $setup).Length / 1MB, 1)
          Write-Output "the installer compiles, $mb MB"

      # DD145. The step above proves Inno accepts the script; this one proves the page it draws is
      # one somebody can read. They are different questions and neither covers the other — a page
      # whose Copy button stands nine pixels below its box compiles perfectly.
      #
      # Here rather than in `dotnet test`, and for one reason: this compiles and runs a real Setup,
      # so it needs ISCC, and ISCC is only on the PATH from the step above. A test that quietly
      # skipped itself when the compiler was missing would be a guard nobody could tell was absent.
      - name: The preflight page renders, in every state it has
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts\page-probe.ps1
          if ($LASTEXITCODE -ne 0) { throw "the preflight page did not survive its own harness" }

      - name: It starts, and says what it is
        run: |
          $exe = "src\FreeWilly.Tray\bin\Release\net10.0-windows\win-x64\publish\FreeWilly.exe"
          # A windowed executable with its output redirected writes to the handle it was given;
          # PowerShell gives it a pipe, which is the same path the installer and scripts use.
          $version = (& $exe --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "--version exited $LASTEXITCODE" }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "--version said '$version', which is not a version the installer can read"
          }
          Write-Output "started, and calls itself $version"

      - name: The engine plan reaches nothing and still answers
        run: |
          $exe = "src\FreeWilly.Tray\bin\Release\net10.0-windows\win-x64\publish\FreeWilly.exe"
          $plan = (& $exe --plan | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "--plan exited $LASTEXITCODE" }
          # The pinned digests travel inside the assembly, so this is also the check that the
          # embedded manifest survived the single-file bundling.
          if ($plan -notmatch 'sha256\s+[0-9a-f]{64}') {
            throw "--plan printed no pinned digest:`n$plan"
          }
          Write-Output "the pinned manifest survived the bundle"

      - name: The preflight runs on a machine that is not the developer's
        run: |
          $exe = "src\FreeWilly.Tray\bin\Release\net10.0-windows\win-x64\publish\FreeWilly.exe"
          # Asserted on having *run*, not on having passed. A hosted runner is a machine this
          # product would refuse, and rightly — it has no WSL2 and no nested virtualization. What
          # is worth knowing is that every probe reached a verdict there instead of throwing, which
          # is the half a developer's own machine can never exercise.
          $report = (& $exe --preflight | Out-String)
          $code = $LASTEXITCODE
          Write-Output $report
          if ($report -notmatch 'what this machine can host') {
            throw "the preflight printed no report (exit $code)"
          }
          if ($report -notmatch '\[(ok|FAIL|warn|\?)\s*\]') {
            throw "the preflight reached no verdict on any row (exit $code)"
          }
          Write-Output "the preflight answered on a second machine, exit $code"

          # This reset is the whole step. Every pwsh step ends with the runner's own
          # `exit $LASTEXITCODE`, and the preflight is the one command here that is *expected* to
          # exit 1 — a hosted runner has no WSL2, so it says so and returns 1. Without this line the
          # step goes red with all of its assertions passing, and it does so only on CI: a
          # developer's machine is healthy, the preflight exits 0, and the trap is invisible.
          exit 0
