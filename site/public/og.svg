<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="FreeWilly — Docker on Windows, without Docker Desktop">
  <defs>
    <linearGradient id="dd-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3AAEE8"/>
      <stop offset="1" stop-color="#1C6BA4"/>
    </linearGradient>
    <linearGradient id="dd-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08131b"/>
      <stop offset="1" stop-color="#0c1a24"/>
    </linearGradient>
    <radialGradient id="dd-glow" cx="0.82" cy="0.05" r="0.7">
      <stop offset="0" stop-color="#2E9BD6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2E9BD6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#dd-bg)"/>
  <rect width="1200" height="630" fill="url(#dd-glow)"/>
  <rect x="0" y="0" width="1200" height="8" fill="#2E9BD6"/>

  <!-- the mark: the logo, at 128px -->
  <g transform="translate(90,120) scale(0.8)">
    <rect width="160" height="160" rx="34" fill="url(#dd-body)"/>
    <rect x="32" y="42" width="70" height="18" rx="5" fill="#ffffff" opacity=".95"/>
    <rect x="32" y="69" width="94" height="18" rx="5" fill="#ffffff" opacity=".78"/>
    <rect x="32" y="96" width="52" height="18" rx="5" fill="#ffffff" opacity=".62"/>
    <circle cx="118" cy="116" r="15" fill="#2EA043" stroke="#0E2029" stroke-width="6"/>
  </g>

  <text x="238" y="180" font-family="DejaVu Sans, sans-serif" font-size="52" font-weight="bold" fill="#e9f2f8">FreeWilly</text>
  <text x="240" y="216" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#7d95a5">part of alegauss</text>

  <text x="90" y="360" font-family="DejaVu Sans, sans-serif" font-size="66" font-weight="bold" fill="#e9f2f8">Docker on Windows,</text>
  <text x="90" y="436" font-family="DejaVu Sans, sans-serif" font-size="66" font-weight="bold" fill="#67C3F2">without Docker Desktop.</text>

  <!-- measured at 995px against the 1020px between the gutters; the previous
       line ran 80px past x=1110 and out of the card -->
  <text x="92" y="502" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#9db3c1">Upstream Moby in a WSL2 distro it owns, on the pipe your tools already use.</text>

  <!-- status badge -->
  <rect x="90" y="540" width="470" height="46" rx="23" fill="#11212c" stroke="#22404f"/>
  <circle cx="118" cy="563" r="6" fill="#67C3F2"/>
  <text x="136" y="571" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#9db3c1">In development · No release yet · Windows 10 / 11</text>

  <text x="1110" y="571" text-anchor="end" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#7d95a5">alegauss.github.io/freewilly</text>
</svg>
